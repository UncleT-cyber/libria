[package]
name = "libria"
version = "0.1.0"
description = "Your music. Your library. Your way."
authors = ["Anthony Abah <a.abah6082@miva.edu.ng>"]
license = "MIT"
repository = "https://github.com/UncleT-cyber/libria"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "libria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Audio
symphonia = { version = "0.5", features = ["all"] }
rodio = "0.19"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# File system
notify = "6"
walkdir = "2"
dirs = "5"

# Metadata
lofty = "0.21"

# Error handling
anyhow = "1"
thiserror = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"

# Cryptography
ring = "0.17"

# Image processing
image = "0.25"
